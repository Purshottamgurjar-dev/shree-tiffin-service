# ==============================================================================
# SHREE TIFFIN SERVICE — RENDER BLUEPRINT (INFRASTRUCTURE AS CODE)
# Tagline: "Ghar Jaisa Khana, Har Din."
# Web Service (Backend) + Static Site (Frontend)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: shree-tiffin-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false # Set to your Render frontend URL (e.g. https://shree-tiffin.onrender.com)
      - key: MONGO_URI
        sync: false # Set to MongoDB Atlas production URI (target: shree_tiffin_service)
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a cryptographically secure 256-bit secret
      - key: JWT_EXPIRE
        value: 30d
      - key: RAZORPAY_KEY_ID
        sync: false # Retrieve from Razorpay Dashboard (rzp_test_... or rzp_live_...)
      - key: RAZORPAY_KEY_SECRET
        sync: false # Retrieve from Razorpay Dashboard
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false # Retrieve from Razorpay Dashboard Webhooks
      - key: OWNER_EMAIL
        value: owner@shreetiffin.com
      - key: OWNER_PASSWORD
        sync: false # Set strong owner password for initial seed
      - key: OWNER_NAME
        value: Shree Kitchen Owner
      - key: OWNER_PHONE
        value: "9876543210"

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (Single Page Application)
  # ----------------------------------------------------------------------------
  - type: web
    name: shree-tiffin
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: singapore
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to backend API URL (e.g. https://shree-tiffin-api.onrender.com/api)
      - key: VITE_RAZORPAY_KEY_ID
        sync: false # Public Razorpay key ID only (rzp_test_... or rzp_live_...)
